<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: url('/static/kca_background.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .signup-box {
      background-color: rgba(255, 255, 255, 0.9); /* semi-transparent overlay */
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      width: 500px;              /* fixed width */
      height: auto;              /* natural height */
    }

    .signup-box h1 {
      color: #192C57; /* KCA navy */
      margin-bottom: 20px;
      text-align: center;
    }

    .btn-signup {
      background-color: #192C57;
      border-color: #192C57;
      color: #fff;
    }

    .btn-signup:hover {
      background-color: #CEAA0C;
      border-color: #CEAA0C;
      color: #192C57;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
      font-size: 0.95rem;
    }

    .login-link a {
      color: #192C57;
      font-weight: 600;
      text-decoration: none;
    }

    .login-link a:hover {
      color: #CEAA0C;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="signup-box">
    <h1><i class="bi bi-person-plus"></i> Sign Up</h1>
    <form id="signupForm" action="{{ url_for('signup') }}" method="post" class="row g-3">
      <div class="col-12">
        <input type="text" name="username" id="username" placeholder="Username" class="form-control" required>
      </div>
      <div class="col-12 position-relative">
        <input type="password" id="password" name="password" placeholder="Password" class="form-control" required>
        <span class="position-absolute top-50 end-0 translate-middle-y me-3" onclick="togglePassword()" style="cursor:pointer;">
          <i id="toggleIcon" class="fas fa-eye"></i>
        </span>
      </div>
      <div class="col-12">
        <input type="email" name="email" id="email" placeholder="Email" class="form-control" required>
      </div>
      <div class="col-12">
        <input type="tel" name="phone" id="phone" placeholder="Phone" class="form-control" required>
      </div>
      <div class="col-12">
        <select name="role" class="form-select">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-signup w-100">
          <i class="bi bi-person-plus"></i> Create Account
        </button>
      </div>
    </form>

    <!-- Login link -->
    <div class="login-link">
      Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById("password");
      const icon = document.getElementById("toggleIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      let isValid = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();

      // Username: must be longer than 2 characters
      if (username.length <= 2) {
        alert("Username must be longer than 2 characters");
        isValid = false;
      } else if (username === password) {
        alert("Username and password cannot be the same");
        isValid = false;
      }

      // Password: must contain at least 1 capital letter
      if (!/[A-Z]/.test(password)) {
        alert("Password must contain at least 1 uppercase letter");
        isValid = false;
      }


      // Phone: must be at least 10 digits
      if (phone.length < 10) {
        alert("Phone must be at least 10 digits");
        isValid = false;
      }

      if (isValid) this.submit();
    });
  </script>
</body>
</html>
