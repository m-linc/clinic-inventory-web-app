<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KCA Clinic System Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: url('/static/kca_background1.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.9); /* semi-transparent overlay */
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 400px;
    }

    .login-box h1 {
      color: #192C57; /* KCA navy */
      margin-bottom: 20px;
      text-align: center;
    }

    .btn-login {
      background-color: #192C57; /* navy button */
      border-color: #192C57;
      color: #fff;
    }

    .btn-login:hover {
      background-color: #CEAA0C; /* gold hover */
      border-color: #CEAA0C;
      color: #192C57;
    }

    .signup-link {
      text-align: center;
      margin-top: 15px;
      font-size: 0.95rem;
    }

    .signup-link a {
      color: #192C57;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover {
      color: #CEAA0C;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-box">

    <!-- Flash Alerts -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-3">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Login Form -->
    <form action="{{ url_for('login') }}" method="post">
      <div class="mb-3">
        <input type="text" name="username" placeholder="Username" class="form-control" required>
      </div>
      <div class="col-12 position-relative">
        <input type="password" id="password" name="password" placeholder="Password" class="form-control" required>
         <span class="position-absolute top-50 end-0 translate-middle-y me-3" onclick="togglePassword()" style="cursor:pointer;">
        <i id="toggleIcon" class="fas fa-eye"></i>
        </span>
      </div>
      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>
    </form>

    <!-- Signup link -->
    <div class="signup-link">
      Don’t have an account? <a href="{{ url_for('signup') }}">Sign up here</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword() {
  const input = document.getElementById("password");
  const icon = document.getElementById("toggleIcon");

  if (input.type === "password") {
    input.type = "text";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
  }
}
</script>
</body>
</html>
